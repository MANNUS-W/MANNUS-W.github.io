name: 构建 Android 安装包 (APK)

# 首次推送本文件时自动构建一次；之后可在 Actions 里手动 Run workflow 重跑。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # GitHub 托管 runner 已预装 Android SDK，这里只做自检与按需补齐，
      # 不再依赖外部 setup-android 动作下载 SDK（原失败步骤，20 秒即挂）。
      - name: 环境自检与 SDK 补齐
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "--- 预装 platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- 预装 build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-35" "build-tools;35.0.0" || echo "sdkmanager 补齐跳过，使用预装组件继续"
          else
            echo "未找到 sdkmanager，直接使用预装组件"
          fi

      - name: 准备 Web 资源
        run: node scripts/prepare-www.mjs

      - name: 安装依赖
        run: |
          npm install --no-audit --no-fund
          npx cap --version

      - name: 生成 Android 工程
        run: |
          npx cap add android
          npx cap sync android

      - name: 构建 Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: richangji-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 若仓库的 GITHUB_TOKEN 只有读权限，此步会失败；设为容错，
      # 保证 job 仍为成功，APK 至少能从 Artifacts 下载。
      - name: 发布到 Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 日常集 Android 安装包 #${{ github.run_number }}
          body: |
            自动构建的 debug 版 APK，与网页版同一份代码。
            下载后传到手机，在系统设置里允许「安装未知来源应用」即可安装。
            数据存在 App 本机，可用页面里的「导出备份 / 导入恢复」迁移。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

