name: 构建 Android 安装包 (APK)

# 首次推送本文件时自动构建一次；之后可在 Actions 里手动 Run workflow 重跑。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: apk-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # runner 预装 Android SDK（platforms 含 android-35、build-tools 含 35.0.0），只做自检。
      - name: 环境自检
        run: |
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" || true

      - name: 准备 Web 资源
        run: node scripts/prepare-www.mjs

      - name: 安装依赖
        run: |
          npm install --no-audit --no-fund
          npx cap --version

      - name: 生成 Android 工程
        run: |
          npx cap add android
          npx cap sync android

      # Capacitor 模板默认下载 gradle-8.11.1-all.zip（约 200MB）且 networkTimeout 仅 10 秒，
      # 在 CI 上极易超时导致 BUILD FAILED。这里换成更小的 -bin 包并把超时放大。
      - name: 调整 Gradle 配置
        run: |
          cd android
          sed -i 's/gradle-8.11.1-all.zip/gradle-8.11.1-bin.zip/' gradle/wrapper/gradle-wrapper.properties
          sed -i 's/networkTimeout=10000/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          if ! grep -q 'networkTimeout=180000' gradle/wrapper/gradle-wrapper.properties; then
            printf '\nnetworkTimeout=180000\n' >> gradle/wrapper/gradle-wrapper.properties
          fi
          echo "--- gradle-wrapper.properties ---"
          cat gradle/wrapper/gradle-wrapper.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "--- local.properties ---"
          cat local.properties
          printf '\norg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m\norg.gradle.daemon=false\n' >> gradle.properties

      # 单独一步预热：如果 Gradle 发行版下载有问题，会在这一步明确失败，而不是混在构建里。
      - name: 预热 Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --version

      - name: 构建 Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      # 失败时把 Gradle 的错误摘要顶到日志末尾，省得再往上翻几百行。
      - name: 失败时输出错误摘要
        if: failure()
        run: |
          echo "===== GRADLE ERROR SUMMARY ====="
          if [ -f /tmp/gradle.log ]; then
            grep -n -A 20 -E "FAILURE: Build failed|What went wrong|Could not download|Could not resolve" /tmp/gradle.log | head -70 || true
            echo "----- 日志最后 40 行 -----"
            tail -40 /tmp/gradle.log
          else
            echo "未生成 gradle.log，失败发生在前面的步骤"
          fi

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: richangji-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 若仓库的 GITHUB_TOKEN 只有读权限，此步会失败；设为容错，
      # 保证 job 仍为成功，APK 至少能从 Artifacts 下载。
      - name: 发布到 Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: 日常集 Android 安装包 #${{ github.run_number }}
          body: |
            自动构建的 debug 版 APK，与网页版同一份代码。
            下载后传到手机，在系统设置里允许「安装未知来源应用」即可安装。
            数据存在 App 本机，可用页面里的「导出备份 / 导入恢复」迁移。
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


