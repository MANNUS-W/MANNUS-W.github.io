<style>
:root{
  --bg:#f3efe7; --card:#fffdf8; --ink:#2f2d28; --sub:#8b857a; --faint:#b3ada1;
  --line:#e7e1d4; --line2:#efeae0;
  --green:#3d6b4f; --green-soft:#edf3ee; --green-deep:#2e5440;
  --clay:#c2703f; --clay-soft:#f8ece1;
  --exp:#bc4834; --exp-soft:#f9eae6; --inc:#2e8b57; --inc-soft:#eaf4ee;
  --warn:#b17f36; --warn-soft:#f7f0e2; --red:#c0392b;
  --gold:#d9a441;
  --r:16px;
  --shadow:0 1px 2px rgba(58,50,35,.05),0 6px 22px rgba(58,50,35,.06);
  --shadow-lift:0 2px 6px rgba(58,50,35,.07),0 14px 34px rgba(58,50,35,.10);
  --serif:"Songti SC","Noto Serif SC","STSong",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:
  radial-gradient(1100px 520px at 88% -6%, rgba(194,112,63,.08), transparent 60%),
  radial-gradient(900px 540px at -8% 14%, rgba(61,107,79,.08), transparent 55%),
  radial-gradient(700px 400px at 55% 110%, rgba(217,164,65,.05), transparent 60%),
  var(--bg);
  background-attachment:fixed;color:var(--ink);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d0c9bb;border-radius:99px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(61,107,79,.12)}
input[type=number]{-moz-appearance:textfield}
#app{display:flex;min-height:100vh}

/* ===== 侧边导航（PC） ===== */
.side{width:196px;flex-shrink:0;padding:26px 14px 20px;border-right:1px solid var(--line);background:linear-gradient(180deg,#faf7f0,#f4f0e7);position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 20px}
.logo-mark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--green-deep),var(--green));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 10px rgba(46,84,64,.28)}
.logo b{font-family:var(--serif);font-size:18px;letter-spacing:2px}
.logo span{display:block;font-size:10px;color:var(--sub);letter-spacing:3.5px;font-weight:500}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:0;background:transparent;border-radius:10px;font-size:14.5px;color:var(--sub);text-align:left;min-height:44px;position:relative;transition:color .15s,background .15s}
.nav button:hover{background:rgba(239,234,224,.7);color:var(--ink)}
.nav button svg{width:19px;height:19px;flex-shrink:0}
.nav button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.nav button.on::before{content:"";position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:18px;border-radius:99px;background:linear-gradient(180deg,var(--green),var(--clay))}
.nav button.on svg{color:var(--green)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px dashed var(--line);font-size:11.5px;color:var(--faint)}
#saveStamp{margin-top:4px}

/* ===== 主区 ===== */
main{flex:1;min-width:0;padding:26px 30px 60px;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar h1{font-family:var(--serif);font-size:24px;font-weight:700;letter-spacing:1px}
.topbar .date{color:var(--sub);font-size:13.5px;margin-top:3px;letter-spacing:.4px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13.5px;min-height:44px;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--faint);background:#fff}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(135deg,#3d6b4f,#2e5440);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(46,84,64,.22)}
.btn.primary:hover{background:linear-gradient(135deg,#355e45,#28493a)}
.btn.danger-ghost{color:var(--exp);border-color:#ecd6d0}
.btn svg{width:15px;height:15px}
section.view{display:none;flex-direction:column;gap:16px}
section.view.on{display:flex}
.card{background:var(--card);border:1px solid rgba(231,225,212,.72);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px}
.card h2{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:12px;letter-spacing:.3px}
.card h2::before{content:"";width:4px;height:14px;border-radius:99px;background:linear-gradient(180deg,var(--green),var(--clay));flex-shrink:0}
.card h2 .hint{font-size:12px;color:var(--faint);font-weight:400;margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
.muted{color:var(--sub);font-size:13px}
.empty{color:var(--faint);font-size:13.5px;text-align:center;padding:18px 0}

/* 表单 */
.form{display:grid;gap:9px}
.form .row{display:flex;gap:8px;flex-wrap:wrap}
.form input,.form select{flex:1;min-width:0}
.form .row input[type=number]{flex:1}
.form label{font-size:12px;color:var(--sub);display:block;margin:0 0 -4px}
.chipbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:999px;padding:6px 13px;font-size:13px;min-height:36px;transition:all .15s}
.chip:hover{border-color:var(--faint);color:var(--ink)}
.chip.on{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 8px rgba(46,84,64,.2)}

/* 列表行 */
.rows{display:flex;flex-direction:column}
.rowitem{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line2);font-size:14px}
.rowitem:last-child{border-bottom:0}
.rowitem .grow{flex:1;min-width:0}
.rowitem .t2{color:var(--sub);font-size:12.5px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:11.5px;border-radius:6px;padding:2px 8px;white-space:nowrap;flex-shrink:0}
.tag.exp{background:var(--exp-soft);color:var(--exp)}
.tag.inc{background:var(--inc-soft);color:var(--inc)}
.tag.pri-高{background:var(--exp-soft);color:var(--exp)}
.tag.pri-中{background:var(--warn-soft);color:var(--warn)}
.tag.pri-低{background:var(--line2);color:var(--sub)}
.tag.st-待办{background:var(--line2);color:var(--sub)}
.tag.st-进行中{background:var(--warn-soft);color:var(--warn)}
.tag.st-已完成{background:var(--inc-soft);color:var(--inc)}
.tag.clay{background:var(--clay-soft);color:var(--clay)}
.money-in{color:var(--inc);font-weight:600;white-space:nowrap}
.money-out{color:var(--exp);font-weight:600;white-space:nowrap}
.iconbtn{border:0;background:transparent;color:var(--faint);width:34px;height:34px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.iconbtn:hover{background:var(--line2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}
.linkbtn{border:0;background:transparent;color:var(--green);font-size:12.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;min-height:32px}
.linkbtn:hover{background:var(--green-soft)}

/* 今日概览 */
.today-hero{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.hero-num{font-family:var(--serif);font-size:34px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.overdue-note{display:flex;align-items:flex-start;gap:10px;background:linear-gradient(100deg,var(--exp-soft),#fdf4f1);border:1px solid #eed6cf;border-left:3px solid var(--exp);border-radius:12px;padding:12px 16px;font-size:13.5px;color:var(--exp)}
.overdue-note>svg{width:19px;height:19px;flex-shrink:0;margin-top:2px}
.overdue-note .btn{flex-shrink:0;white-space:nowrap;padding:9px 12px}
.habit-mini{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line2);font-size:13.5px}
.habit-mini:last-child{border-bottom:0}
.habit-mini .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-check{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--faint);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:transparent;flex-shrink:0}
.mini-check.done{background:var(--green);border-color:var(--green);color:#fff}
.mini-check svg{width:13px;height:13px}
.ring-wrap{display:flex;align-items:center;gap:14px}

/* 统计块 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:linear-gradient(160deg,#fbf8f1,#f3eee2);border:1px solid var(--line2);border-radius:12px;padding:12px 14px}
.stat .k{font-size:12px;color:var(--sub)}
.stat .v{font-size:21px;font-weight:700;margin-top:3px;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.stat .v.out{color:var(--exp)}.stat .v.inc{color:var(--inc)}

/* 进度条 */
.bar{height:9px;background:var(--line2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green-deep),#5b8a68)}
.bar.over>i{background:var(--exp)}

/* 热力图 */
.heat{display:flex;gap:3px;flex-wrap:wrap}
.heat i{width:11px;height:18px;border-radius:3px;background:var(--line2)}
.heat i.l1{background:#cfe0d2}.heat i.l2{background:#8fb89b}.heat i.l3{background:#54876a}.heat i.l4{background:#3f6b51}

/* 习惯卡 */
.habit-card .head{display:flex;align-items:center;gap:9px}
.habit-card .head b{font-size:15px}
.counter{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.counter button{border:0;background:#fff;width:40px;height:40px;font-size:17px;color:var(--green)}
.counter button:hover{background:var(--green-soft)}
.counter .cv{min-width:64px;text-align:center;font-weight:700;font-size:14.5px;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 6px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.ckbox{width:32px;height:32px;border-radius:10px;border:1.5px solid var(--faint);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:transparent}
.ckbox.done{background:var(--green);border-color:var(--green);color:#fff}
.ckbox svg{width:15px;height:15px}
.val-input{width:110px}

/* 书影音 */
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.mcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);transition:transform .18s,box-shadow .18s}
.mcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.mcard .cover{aspect-ratio:3/4;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.4);position:relative}
.mcard .cover .typechar{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:13px;text-shadow:none}
.mcard .meta{padding:10px 12px 12px}
.mcard .meta .t{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard .meta .s{color:var(--sub);font-size:12px;margin-top:2px;display:flex;gap:6px;align-items:center}
.stars{color:#d9a441;font-size:12.5px;letter-spacing:1px}
.mrow{display:flex;gap:12px;align-items:center;padding:11px 2px;border-bottom:1px solid var(--line2)}
.mrow:last-child{border-bottom:0}
.mrow .thumb{width:40px;height:52px;border-radius:8px;background-size:cover;background-position:center;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px}

/* 图表 */
.chart-box svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--sub)}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .li i{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.legend .li .pct{margin-left:auto;color:var(--ink);font-weight:600}
.donut-flex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-flex .ring{width:130px;flex-shrink:0}
.donut-flex .legend{flex:1;min-width:140px}

/* 周计划 */
.weekplan{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.weekplan .d{font-size:12px;color:var(--sub);margin-bottom:4px;text-align:center}
.weekplan input{width:100%;padding:8px;font-size:14px;min-height:44px}

/* 弹窗 & 提示 */
#modalMask{position:fixed;inset:0;background:rgba(40,36,28,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
#modalMask.on{display:flex}
.modal{background:var(--card);border-radius:20px;padding:24px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line2)}
.modal h3{font-size:16px;margin-bottom:8px}
.modal p{color:var(--sub);font-size:13.5px;margin-bottom:18px;word-break:break-all}
.modal .acts{display:flex;gap:10px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#2f2d28;color:#fff;padding:11px 20px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:70;max-width:80vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#toast.on{opacity:.95}
#toast.err{background:var(--red)}

/* 移动端 */
.tabbar{display:none}
@media (max-width:860px){
  #app{flex-direction:column}
  .side{display:none}
  main{padding:18px 14px 96px}
  .grid2,.grid3{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,1fr)}
  .weekplan{grid-template-columns:1fr 1fr}
  .weekplan .d{text-align:left}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(253,251,246,.88);backdrop-filter:blur(14px) saturate(1.3);border-top:1px solid rgba(231,225,212,.8);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:50}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;color:var(--faint);font-size:10.5px;padding:5px 0 3px;min-height:50px;min-width:0;position:relative}
  .tabbar button svg{width:20px;height:20px}
  .tabbar button.on{color:var(--green);font-weight:600}
  .tabbar button.on::after{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--clay))}
  .card{padding:15px 14px}
  .overdue-note{flex-wrap:wrap;padding:12px 13px}
  .overdue-note>div{flex:1 1 calc(100% - 30px);min-width:0}
  .overdue-note .btn{margin-left:auto;margin-top:2px}
  .topbar h1{font-size:20px;letter-spacing:.5px}
  .hero-num{font-size:24px}
  .today-hero{gap:10px}
  .ring-wrap{gap:10px}
  .form .row input,.form .row select{min-width:118px}
  .form .row .btn{flex:1 0 auto}
  .rowitem{gap:8px;align-items:flex-start}
  .rowitem .iconbtn{width:28px;height:28px;margin-top:2px}
  .rowitem .linkbtn{padding:4px 6px;margin-top:2px}
  .tag{font-size:11px;padding:2px 6px}
  #toast{bottom:110px}
}
@media (max-width:360px){ .stats{grid-template-columns:repeat(2,1fr)} }
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 12.5 10 18 20 6"/></svg>
      </div>
      <div><b>日常集</b><span>LIFE DESK</span></div>
    </div>
    <nav class="nav" id="navPC"></nav>
    <div class="side-foot">数据保存在本设备浏览器<br><span id="saveStamp">—</span></div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1 id="viewTitle">今日概览</h1>
        <div class="date" id="dateLine"></div>
      </div>
      <div class="top-actions">
        <button class="btn primary" id="btnInstall" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M12 7v6m0 0 2.5-2.5M12 13 9.5 10.5"/><path d="M10.5 18h3"/></svg>安装到桌面</button>
        <button class="btn" id="btnExport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>导出备份</button>
        <button class="btn" id="btnImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L8 7m4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>导入恢复</button>
        <button class="btn danger-ghost" id="btnClearSeed">清空示例</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </div>

    <section class="view on" id="view-today">
      <div class="card" id="todayHero"></div>
      <div id="overdueBox"></div>
      <div class="grid3">
        <div class="card" id="todaySched"></div>
        <div class="card" id="todayHabits"></div>
        <div class="card" id="todayMoney"></div>
      </div>
      <div class="grid2">
        <div class="card" id="todayBuy"></div>
        <div class="card" id="todayMedia"></div>
      </div>
    </section>

    <section class="view" id="view-ledger">
      <div class="grid2">
        <div class="card">
          <h2>记一笔</h2>
          <div class="form">
            <div class="row"><select id="txType"><option>支出</option><option>收入</option></select><select id="txCat"></select></div>
            <div class="row"><input type="number" id="txAmt" placeholder="金额 ¥" step="0.01" min="0"><input type="date" id="txDate"></div>
            <div class="row"><input id="txNote" placeholder="备注（选填）"><button class="btn primary" id="txAdd" style="flex:0 0 auto">保存</button></div>
          </div>
        </div>
        <div class="card">
          <h2>本月预算 <span class="hint" id="budgetHint"></span></h2>
          <div class="form">
            <div class="row"><input type="number" id="budgetInput" placeholder="设置月预算 ¥" min="0"><button class="btn" id="budgetSave" style="flex:0 0 auto">保存预算</button></div>
            <div id="budgetBar"></div>
          </div>
        </div>
      </div>
      <div class="card">
        <h2>收支总览 <span class="hint" id="ledgerMonthLabel"></span></h2>
        <div class="chipbar" style="margin-bottom:12px">
          <button class="btn" id="monthPrev" style="min-width:40px;padding:9px 10px">‹</button>
          <b id="monthNow" style="min-width:86px;text-align:center"></b>
          <button class="btn" id="monthNext" style="min-width:40px;padding:9px 10px">›</button>
        </div>
        <div class="stats" id="ledgerStats"></div>
        <div class="grid2" style="margin-top:14px">
          <div class="chart-box" id="chart6m"></div>
          <div class="chart-box" id="chartDonut"></div>
        </div>
      </div>
      <div class="card">
        <h2>流水明细 <span class="hint"><button class="linkbtn" id="txCsv">导出 CSV</button></span></h2>
        <div class="chipbar" style="margin-bottom:8px">
          <button class="chip on" data-txf="all">全部</button>
          <button class="chip" data-txf="支出">支出</button>
          <button class="chip" data-txf="收入">收入</button>
          <select id="txCatFilter" style="width:auto;min-height:36px;font-size:13px"><option value="">全部分类</option></select>
        </div>
        <div id="txList" class="rows"></div>
      </div>
    </section>

    <section class="view" id="view-habits">
      <div class="card">
        <h2>新增习惯</h2>
        <div class="form">
          <div class="row"><input id="hbName" placeholder="习惯名称，如 喝水"><select id="hbMode" style="flex:0 0 130px"><option value="check">勾选打卡</option><option value="count">计数（次）</option><option value="value">数值（自定义）</option></select></div>
          <div class="row"><input type="number" id="hbTarget" placeholder="每日目标（计数/数值必填）" min="1"><input id="hbUnit" placeholder="单位，如 ml / 分钟（选填）" style="flex:1"><button class="btn primary" id="hbAdd" style="flex:0 0 auto">添加</button></div>
        </div>
      </div>
      <div id="habitList" style="display:flex;flex-direction:column;gap:14px"></div>
    </section>

    <section class="view" id="view-fitness">
      <div class="stats" id="fitStats"></div>
      <div class="card">
        <h2>今日记录 <span class="hint">体重体脂与热量可只填部分</span></h2>
        <div class="form">
          <div class="row"><input type="date" id="wtDate"><input type="number" id="wtW" placeholder="体重 kg" step="0.1"><input type="number" id="wtFat" placeholder="体脂率 %" step="0.1"><input type="number" id="wtIn" placeholder="摄入 kcal"><input type="number" id="wtBurn" placeholder="消耗 kcal"><button class="btn primary" id="wtAdd" style="flex:0 0 auto">保存</button></div>
        </div>
      </div>
      <div class="grid2">
        <div class="card chart-box"><h2>体重走势 <span class="hint" id="wtHint"></span></h2><div id="chartWeight"></div></div>
        <div class="card">
          <h2>目标与缺口</h2>
          <div class="form">
            <div class="row"><input type="number" id="heightInput" placeholder="身高 cm" step="0.1"><input type="number" id="goalInput" placeholder="目标体重 kg" step="0.1"><button class="btn" id="fitSet" style="flex:0 0 auto">保存</button></div>
          </div>
          <div id="bmiBox" style="margin-top:12px"></div>
          <div id="goalBox" style="margin-top:10px"></div>
          <div id="gapBox" style="margin-top:10px"></div>
        </div>
      </div>
      <div class="card">
        <h2>本周运动计划 <span class="hint">改动即自动保存</span></h2>
        <div class="weekplan" id="weekPlan"></div>
      </div>
    </section>

    <section class="view" id="view-sched">
      <div class="card">
        <h2>新增事项</h2>
        <div class="form">
          <div class="row"><input id="scText" placeholder="要做的事…"><input type="date" id="scDate"><select id="scPri" style="flex:0 0 110px"><option>高</option><option selected>中</option><option>低</option></select><button class="btn primary" id="scAdd" style="flex:0 0 auto">添加</button></div>
        </div>
      </div>
      <div class="stats" id="scStats"></div>
      <div id="schedList" style="display:flex;flex-direction:column;gap:14px"></div>
    </section>

    <section class="view" id="view-buy">
      <div class="card">
        <h2>想买点什么</h2>
        <div class="form">
          <div class="row"><input id="buyName" placeholder="物品名称"><select id="buyCat" style="flex:0 0 110px"><option>食品</option><option>生活</option><option>数码</option><option>衣物</option><option>其他</option></select><input type="number" id="buyQty" placeholder="数量" min="1" value="1" style="flex:0 0 90px"><input type="number" id="buyPrice" placeholder="预估价 ¥" step="0.01"><button class="btn primary" id="buyAdd" style="flex:0 0 auto">添加</button></div>
        </div>
      </div>
      <div class="stats" id="buyStats"></div>
      <div class="card"><h2>清单</h2><div id="buyList" class="rows"></div></div>
    </section>

    <section class="view" id="view-media">
      <div class="card">
        <h2>收藏一部作品</h2>
        <div class="form">
          <div class="row"><input id="mdName" placeholder="书名 / 片名 / 专辑"><select id="mdType" style="flex:0 0 90px"><option>书</option><option>影</option><option>音</option></select><select id="mdStatus" style="flex:0 0 110px"><option>想看</option><option>在看</option><option>看完</option></select><select id="mdStars" style="flex:0 0 110px"><option value="0">未评分</option><option value="1">★1</option><option value="2">★2</option><option value="3">★3</option><option value="4">★4</option><option value="5">★5</option></select></div>
          <div class="row"><input id="mdReview" placeholder="一句短评（选填）"><input id="mdCover" placeholder="封面图链接（选填）"><input type="date" id="mdFinish" title="完成日期"><button class="btn primary" id="mdAdd" style="flex:0 0 auto">添加</button></div>
        </div>
      </div>
      <div class="card"><h2>年度统计 <span class="hint" id="mdYearHint"></span></h2><div id="mdYearStats"></div></div>
      <div class="card">
        <h2>我的收藏 <span class="hint" id="mediaCount"></span></h2>
        <div class="chipbar" style="margin-bottom:12px;justify-content:space-between">
          <span class="chipbar">
            <button class="chip on" data-mdf="all">全部</button>
            <button class="chip" data-mdf="书">书</button>
            <button class="chip" data-mdf="影">影</button>
            <button class="chip" data-mdf="音">音</button>
          </span>
          <span class="chipbar">
            <button class="chip on" data-mdv="wall">封面墙</button>
            <button class="chip" data-mdv="list">列表</button>
          </span>
        </div>
        <div id="mediaList"></div>
      </div>
    </section>
  </main>

  <nav class="tabbar" id="navMB"></nav>
</div>
<div id="modalMask"><div class="modal"><h3 id="mTitle"></h3><p id="mText"></p><div class="acts"><button class="btn" id="mCancel">取消</button><button class="btn primary" id="mOk">确定</button></div></div></div>
<div id="toast"></div>
<script>
/* =====================================================================
   日常集 · 生活工作台 —— 单文件版（本地方案）
   数据层 → 计算层 → 渲染层，渲染函数之间互不调用，统一由 refreshAll 调度
   ===================================================================== */
(function(){
'use strict';
/* ---------- 小工具 ---------- */
var $=function(s){return document.querySelector(s)};
var $$=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))};
function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function money(n){n=Number(n)||0;return n.toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:2})}
function pad(n){return (n<10?'0':'')+n}
function dstr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return dstr(new Date())}
function addDays(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)}
function wkCN(s){return '日一二三四五六'[new Date(s+'T00:00:00').getDay()]}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function chk(v){return v===true||v==='true'||v===1}

var SVG={
  ok:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M4 12.5 10 18 20 6"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13M9 7V4h6v3"/></svg>',
  nav:{
    today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>',
    ledger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg>',
    habits:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5 11 15l4.5-5.5"/></svg>',
    fitness:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9.5v5M21 9.5v5M6.5 12h11"/></svg>',
    sched:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    buy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.2 12a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 8Z"/><path d="M9 10V6a3 3 0 0 1 6 0v4"/></svg>',
    media:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5L10 9.5Z"/></svg>'
  }
};
var TABS=[
  {id:'today',name:'今日概览',short:'概览'},
  {id:'ledger',name:'记账理财',short:'记账'},
  {id:'habits',name:'习惯健康',short:'习惯'},
  {id:'fitness',name:'减脂健身',short:'减脂'},
  {id:'sched',name:'日程统筹',short:'日程'},
  {id:'buy',name:'待买清单',short:'清单'},
  {id:'media',name:'书影音收藏',short:'书影音'}

/* ---------- 数据层（localStorage） ---------- */

/* ---------- 计算层（纯函数） ---------- */
function mk(s){return String(s||'').slice(0,7)}
function txInMonth(list,m){return list.filter(function(r){return mk(r.date)===m})}
function sumBy(list,f){return list.reduce(function(a,r){return a+(Number(f(r))||0)},0)}
function monthExp(list,m){return sumBy(txInMonth(list,m).filter(function(r){return r.type==='支出'}),function(r){return r.amount})}
function monthInc(list,m){return sumBy(txInMonth(list,m).filter(function(r){return r.type==='收入'}),function(r){return r.amount})}
function lastMonths(n){var out=[],d=new Date();d.setDate(1);for(var i=n-1;i>=0;i--){var x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push(dstr(x).slice(0,7))}return out}
function schedOf(list,date){return list.filter(function(r){return r.date===date&&r.status!=='已完成'})}
function overdueOf(list,todayS){return list.filter(function(r){return r.status!=='已完成'&&r.date<todayS})}
function habitLog(hid,date){for(var i=0;i<state.hlogs.length;i++){var l=state.hlogs[i];if(l.habitId===hid&&l.date===date)return l}return null}
function habitRatio(h,date){var l=habitLog(h.id,date);if(!l)return 0;var v=Number(l.value)||0,t=h.mode==='check'?1:(Number(h.target)||1);return Math.min(1,v/t)}
function habitDone(h,date){return habitRatio(h,date)>=1}
function streak(h){var n=0,d=today();if(!habitDone(h,d))d=addDays(d,-1);while(habitDone(h,d)){n++;d=addDays(d,-1);if(n>999)break}return n}
function weightSorted(){return state.weight.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function avg7(series){if(series.length<4)return null;var t=series.slice(-7);return t.reduce(function(a,r){return a+r.v},0)/t.length}
function bmiNow(){var ws=weightSorted();if(!ws.length||!state.meta.height)return null;var w=ws[ws.length-1].w,h=Number(state.meta.height)/100;return w/(h*h)}
function bmiLabel(b){return b<18.5?['偏瘦','#c77d4f']:b<24?['正常','#2e8b57']:b<28?['超重','#b98035']:['肥胖','#bf4a35']}
function goalProgress(){var ws=weightSorted();if(ws.length<1||!state.meta.goalW)return null;var start=ws[0].w,cur=ws[ws.length-1].w,goal=Number(state.meta.goalW);if(start===goal)return 1;var p=(start-cur)/(start-goal);return Math.max(0,Math.min(1,p))}
function energySorted(){return state.energy.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0})}
function gapToday(){var t=today(),e=energySorted().filter(function(r){return r.date===t});if(!e.length)return null;var r=e[e.length-1];return (Number(r.burn)||0)-(Number(r.in)||0)}
function buyPending(){return state.buy.filter(function(r){return r.status==='待买'})}
function mediaYearStats(){var map={};state.media.forEach(function(m){if(m.status==='看完'&&m.finish){var y=mk(m.finish).slice(0,4);if(!map[y])map[y]={n:0,stars:0,sn:0};map[y].n++;if(Number(m.stars)>0){map[y].stars+=Number(m.stars);map[y].sn++}}});var ys=Object.keys(map).sort();return ys.map(function(y){return {y:y,n:map[y].n,avg:map[y].sn?map[y].stars/map[y].sn:0}})}
function yearCount(){var y=mk(today()).slice(0,4);return mediaYearStats().filter(function(r){return r.y===y}).map(function(r){return r.n})[0]||0}

function ringSVG(p,size,color){size=size||46;p=Math.max(0,Math.min(1,p||0));var r=(size-7)/2,c=2*Math.PI*r;
 var track='<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="#e5ded0" stroke-width="6"/>';
 var prog=p>0?'<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+(c*p).toFixed(1)+' '+(c*(1-p)).toFixed(1)+'" transform="rotate(-90 '+size/2+' '+size/2+')"/>':'';
 return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+track+prog+'</svg>'}

function renderFitness(){
  var ws=weightSorted(),cur=ws.length?ws[ws.length-1]:null;
  var b=bmiNow(),bl=b?bmiLabel(b):null;
  var gp=goalProgress();
  $('#fitStats').innerHTML=
    '<div class="stat"><div class="k">最新体重</div><div class="v">'+(cur?cur.w+' kg':'—')+'</div></div>'
   +'<div class="stat"><div class="k">最新体脂率</div><div class="v">'+(cur&&cur.fat?cur.fat+'%':'—')+'</div></div>'
   +'<div class="stat"><div class="k">今日热量缺口</div><div class="v" style="color:'+(gapToday()>0?'var(--inc)':'var(--exp)')+'">'+(gapToday()===null?'—':(gapToday()>0?'+':'')+gapToday()+' kcal')+'</div></div>';
  /* 体重折线 + 7日均线 */
  var series=ws.map(function(r){return {d:r.date,v:Number(r.w)||0}});
  var av=avg7(series);
  var n=series.length;
  if(n===0){$('#chartWeight').innerHTML='<div class="empty">还没有记录</div>';$('#wtHint').textContent='';}
  else{
    var all=series.map(function(p){return p.v}).concat(av?[av]:[]);
    var min=Math.min.apply(null,all),max=Math.max.apply(null,all);if(max-min<1){max=min+1}
    var W=560,H=190,L=34,Rp=14,T=14,B=28,iw=W-L-Rp,ih=H-T-B;
    function px(i){return L+(n===1?iw/2:iw*i/(n-1))}
    function py(v){return T+ih*(1-(v-min)/(max-min))}
    var pts=series.map(function(p,i){return px(i).toFixed(1)+','+py(p.v).toFixed(1)}).join(' ');
    var svg='<svg viewBox="0 0 560 190"><line x1="'+L+'" y1="'+(T+ih)+'" x2="'+(W-Rp)+'" y2="'+(T+ih)+'" stroke="var(--line)"/>';
    svg+='<text x="'+(L-6)+'" y="'+(py(max)+4)+'" font-size="10" fill="var(--faint)" text-anchor="end">'+max.toFixed(1)+'</text>';
    svg+='<text x="'+(L-6)+'" y="'+(py(min)+4)+'" font-size="10" fill="var(--faint)" text-anchor="end">'+min.toFixed(1)+'</text>';
    if(av!==null)svg+='<line x1="'+L+'" y1="'+py(av).toFixed(1)+'" x2="'+(W-Rp)+'" y2="'+py(av).toFixed(1)+'" stroke="var(--clay)" stroke-dasharray="5 4" stroke-width="1.5"/>';
    svg+='<polyline points="'+pts+'" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linejoin="round"/>';
    series.forEach(function(p,i){
      svg+='<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p.v).toFixed(1)+'" r="4" fill="var(--green)"><title>'+p.d+' · '+p.v+' kg</title></circle>';
      if(n<=10)svg+='<text x="'+px(i).toFixed(1)+'" y="'+(T+ih+18)+'" font-size="9.5" fill="var(--sub)" text-anchor="middle">'+p.d.slice(5)+'</text>';
    });
    svg+='</svg>';
    $('#chartWeight').innerHTML=svg;
    $('#wtHint').textContent=(av!==null?'近7日均值 '+av.toFixed(1)+' kg':'记录 '+n+' 天')+(ws[ws.length-1].fat?' · 体脂 '+ws[ws.length-1].fat+'%':'');
  }
  /* BMI */
  var bm='';
  if(b){var lab=bmiLabel(b);
    bm='<div style="display:flex;align-items:center;gap:12px">'+ringSVG(Math.min(1,(b-14)/20),46,lab[1])
     +'<div><div class="muted">BMI</div><div style="font-size:20px;font-weight:700">'+b.toFixed(1)+' <span style="font-size:12.5px;color:'+lab[1]+'">'+lab[0]+'</span></div></div></div>'
     +'<div class="muted" style="margin-top:6px">健康区间 18.5 – 24</div>';
  }else bm='<div class="empty">记录体重并填写身高后显示</div>';
  $('#bmiBox').innerHTML=bm;
  var goal='';
  if(gp!==null&&cur){
    goal='<div class="bar"><i style="width:'+Math.round(gp*100)+'%"></i></div><div class="muted" style="margin-top:6px">目标 '+state.meta.goalW+' kg · 还差 <b>'+(cur.w-Number(state.meta.goalW)).toFixed(1)+'</b> kg（进度 '+Math.round(gp*100)+'%）</div>';
  }else goal='<div class="empty">设定目标体重后显示进度</div>';
  $('#goalBox').innerHTML=goal;
  /* 热量缺口近7天 */
  var es=energySorted().slice(-7);
  var gaps=es.map(function(r){return {d:r.date,g:(Number(r.burn)||0)-(Number(r.in)||0)}});
  var ghtml='';
  if(gaps.length){
    var maxG=1;gaps.forEach(function(x){maxG=Math.max(maxG,Math.abs(x.g))});
    ghtml='<div style="display:flex;align-items:flex-end;gap:6px;height:64px;margin-top:4px">'+gaps.map(function(x){
      var h=Math.max(4,Math.round(Math.abs(x.g)/maxG*48));
      return '<div style="flex:1;text-align:center" title="'+x.d+' · 缺口 '+x.g+' kcal"><div style="height:'+h+'px;background:'+(x.g>0?'var(--inc)':'var(--exp)')+';opacity:.8;border-radius:4px 4px 0 0"></div><div class="muted" style="font-size:9.5px">'+x.d.slice(8)+'</div></div>'}).join('')+'</div>'
     +'<div class="muted" style="margin-top:6px">缺口 = 消耗 − 摄入，绿色为正缺口</div>';
  }else ghtml='<div class="empty">记录摄入与消耗后显示</div>';
  $('#gapBox').innerHTML='<div class="muted" style="margin-bottom:2px">近 7 天热量缺口</div>'+ghtml;
  /* 周计划 */
  var days=['周一','周二','周三','周四','周五','周六','周日'];
  $('#weekPlan').innerHTML=days.map(function(dn,i){
    return '<div><div class="d">'+dn+'</div><input data-plan="'+i+'" value="'+esc(state.plan[i]||'')+'" placeholder="休息"></div>'}).join('');
  if(!$('#heightInput').value&&state.meta.height)$('#heightInput').value=state.meta.height;
  if(!$('#goalInput').value&&state.meta.goalW)$('#goalInput').value=state.meta.goalW;
}

function bindListActions(root){
  if(!root)return;

  $$('#'+root.id+' [data-scdel]').forEach(function(b){b.onclick=function(){askConfirm('删除这条日程？','删除后无法恢复。',function(){state.sched=state.sched.filter(function(r){return r.id!==b.getAttribute('data-scdel')});persist(K.sched);refreshAll()})}});
  $$('#'+root.id+' [data-sct]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-sct');state.sched.forEach(function(r){if(r.id===id){r.status=r.status==='已完成'?'待办':'已完成'}});persist(K.sched);refreshAll()}});
  $$('#'+root.id+' [data-sctoday]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-sctoday');state.sched.forEach(function(r){if(r.id===id)r.date=today()});persist(K.sched);toast('已顺延到今天');refreshAll()}});
  $$('#'+root.id+' [data-buyt]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-buyt');state.buy.forEach(function(r){if(r.id===id)r.status=r.status==='已买'?'待买':'已买'});persist(K.buy);refreshAll()}});
  $$('#'+root.id+' [data-buydel]').forEach(function(b){b.onclick=function(){askConfirm('删除这一项？','删除后无法恢复。',function(){state.buy=state.buy.filter(function(r){return r.id!==b.getAttribute('data-buydel')});persist(K.buy);refreshAll()})}});
  $$('#'+root.id+' [data-mddel]').forEach(function(b){b.onclick=function(){askConfirm('删除这条收藏？','删除后无法恢复。',function(){state.media=state.media.filter(function(r){return r.id!==b.getAttribute('data-mddel')});persist(K.media);refreshAll()})}});
}
function bindAll(){
  /* PWA 安装入口 */
  (function(){
    var ib=$('#btnInstall');if(!ib)return;
    var standalone=(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;
    if(standalone){ib.style.display='none';return}
    var evt=null;
    window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();evt=e;ib.style.display='inline-flex'});
    window.addEventListener('appinstalled',function(){ib.style.display='none';toast('已安装，桌面图标可直开')});
    ib.addEventListener('click',function(){
      if(!evt){toast('用浏览器菜单里的「添加到主屏幕」即可');return}
      evt.prompt();
      evt.userChoice.then(function(){evt=null;ib.style.display='none'}).catch(function(){});
    });
    /* iOS Safari 不支持 beforeinstallprompt，给一次引导 */
    if(/iPad|iPhone|iPod/.test(navigator.userAgent)){
      var shown=false;
      try{shown=!!sessionStorage.getItem('wb_ios_tip')}catch(e){}
      if(!shown){setTimeout(function(){try{sessionStorage.setItem('wb_ios_tip','1')}catch(e){}toast('点浏览器「分享」→「添加到主屏幕」，即可当 App 用')},2800)}
    }
  })();
  /* 记账 */
  var catMap={支出:['餐饮','购物','交通','居家','娱乐','医疗','学习','其他'],收入:['工资','副业','红包','其他']};
  function fillCat(){var t=$('#txType').value;$('#txCat').innerHTML=catMap[t].map(function(c){return '<option>'+c+'</option>'}).join('')}
  fillCat();
  $('#txType').addEventListener('change',fillCat);
  $('#txAdd').addEventListener('click',function(){
    var a=num($('#txAmt').value);
    if(a<=0){toast('请填写正确的金额','err');return}
    state.tx.push({id:uid(),date:$('#txDate').value||today(),type:$('#txType').value,cat:$('#txCat').value,amount:a,note:$('#txNote').value.trim()});
    persist(K.tx);$('#txAmt').value='';$('#txNote').value='';$('#txDate').value=today();toast('已记账');refreshAll();
  });
  $('#txDate').value=today();
  $('#monthPrev').addEventListener('click',function(){var d=new Date((state.ui.m||mk(today()))+'-01T00:00:00');d.setMonth(d.getMonth()-1);state.ui.m=mk(dstr(d));refreshAll()});
  $('#monthNext').addEventListener('click',function(){var d=new Date((state.ui.m||mk(today()))+'-01T00:00:00');d.setMonth(d.getMonth()+1);state.ui.m=mk(dstr(d));refreshAll()});
  $$('[data-txf]').forEach(function(b){b.addEventListener('click',function(){$$('[data-txf]').forEach(function(x){x.classList.remove('on')});b.classList.add('on');state.ui.txf=b.getAttribute('data-txf');refreshAll()})});
  $('#txCatFilter').addEventListener('change',function(){state.ui.txCat=this.value;refreshAll()});
  $('#budgetSave').addEventListener('click',function(){var v=num($('#budgetInput').value);if(v<=0){toast('预算需大于 0','err');return}state.meta.budget=v;persist(K.meta);toast('预算已保存');refreshAll()});
  $('#txCsv').addEventListener('click',function(){
    var rows=[['日期','类型','分类','金额','备注']].concat(state.tx.slice().sort(function(a,b){return a.date<b.date?-1:1}).map(function(r){return [r.date,r.type,r.cat,r.amount,r.note||'']}));
    var csv='\ufeff'+rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
    var a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download='记账流水.csv';a.click();
  });
  /* 习惯 */
  $('#hbMode').addEventListener('change',function(){
    if(this.value==='check'){$('#hbTarget').value=1;$('#hbTarget').placeholder='勾选打卡无需目标'}else{$('#hbTarget').value='';$('#hbTarget').placeholder='每日目标（必填）'}
  });
  $('#hbAdd').addEventListener('click',function(){
    var n=$('#hbName').value.trim();if(!n){toast('请填写习惯名称','err');return}
    var mode=$('#hbMode').value,tt=num($('#hbTarget').value);
    if(mode!=='check'&&tt<=0){toast('计数/数值习惯需要目标值','err');return}
    state.habits.push({id:uid(),name:n,mode:mode,target:mode==='check'?1:tt,unit:$('#hbUnit').value.trim()});
    persist(K.habits);$('#hbName').value='';$('#hbTarget').value='';$('#hbUnit').value='';toast('习惯已添加');refreshAll();
  });
  $('#habitList').addEventListener('click',function(e){
    var t=e.target.closest('[data-hbt]'),inc=e.target.closest('[data-hinc]'),dec=e.target.closest('[data-hdec]'),del=e.target.closest('[data-hbdel]');
    if(t){var id=t.getAttribute('data-hbt'),h=state.habits.filter(function(x){return x.id===id})[0];if(!h)return;
      var l=habitLog(id,today());
      if(l&&Number(l.value)>=1){state.hlogs=state.hlogs.filter(function(x){return x!==l})}else{
        if(l)l.value=h.mode==='check'?1:h.target;else state.hlogs.push({id:uid(),habitId:id,date:today(),value:h.mode==='check'?1:h.target});
      }
      persist(K.hlogs);refreshAll();return}
    if(inc||dec){var id2=(inc||dec).getAttribute(inc?'data-hinc':'data-hdec'),h2=state.habits.filter(function(x){return x.id===id2})[0];if(!h2)return;
      var l2=habitLog(id2,today());var v=l2?Number(l2.value)||0:0;v=Math.max(0,v+(inc?1:-1));
      if(l2)l2.value=v;else state.hlogs.push({id:uid(),habitId:id2,date:today(),value:v});
      persist(K.hlogs);refreshAll();return}
    if(del){var id3=del.getAttribute('data-hbdel');askConfirm('删除这个习惯？','打卡记录将一并删除。',function(){state.habits=state.habits.filter(function(x){return x.id!==id3});state.hlogs=state.hlogs.filter(function(x){return x.habitId!==id3});persist(K.habits);persist(K.hlogs);refreshAll()})}
  });
  $('#habitList').addEventListener('change',function(e){
    var inp=e.target.closest('[data-hval]');if(!inp)return;
    var id=inp.getAttribute('data-hval'),h=state.habits.filter(function(x){return x.id===id})[0];if(!h)return;
    var v=num(inp.value),l=habitLog(id,today());
    if(v>0){if(l)l.value=v;else state.hlogs.push({id:uid(),habitId:id,date:today(),value:v})}
    else if(l){state.hlogs=state.hlogs.filter(function(x){return x!==l})}
    persist(K.hlogs);refreshAll();
  });
  /* 减脂 */
  $('#wtAdd').addEventListener('click',function(){
    var d=$('#wtDate').value||today(),w=$('#wtW').value,f=$('#wtFat').value,inp=$('#wtIn').value,bn=$('#wtBurn').value;
    if(w!==''&&num(w)<=0){toast('体重数据不对','err');return}
    var touch=false;
    if(w!==''){state.weight=state.weight.filter(function(r){return r.date!==d});state.weight.push({id:uid(),date:d,w:num(w),fat:f!==''?num(f):null});touch=true}
    if(inp!==''||bn!==''){state.energy=state.energy.filter(function(r){return r.date!==d});state.energy.push({id:uid(),date:d,in:inp!==''?num(inp):null,burn:bn!==''?num(bn):null});touch=true}
    if(!touch){toast('至少填一项','err');return}
    persist(K.weight);persist(K.energy);$('#wtW').value='';$('#wtFat').value='';$('#wtIn').value='';$('#wtBurn').value='';toast('已记录');refreshAll();
  });
  $('#wtDate').value=today();
  $('#fitSet').addEventListener('click',function(){
    var h=num($('#heightInput').value),g=num($('#goalInput').value);
    if(h>0)state.meta.height=h;if(g>0)state.meta.goalW=g;
    persist(K.meta);toast('已保存');refreshAll();
  });
  $('#weekPlan').addEventListener('change',function(e){
    var inp=e.target.closest('[data-plan]');if(!inp)return;
    state.plan[Number(inp.getAttribute('data-plan'))]=inp.value.trim();persist(K.plan);
  });
  /* 日程 */
  $('#scAdd').addEventListener('click',function(){
    var txt=$('#scText').value.trim();if(!txt){toast('请填写事项内容','err');return}
    state.sched.push({id:uid(),date:$('#scDate').value||today(),text:txt,pri:$('#scPri').value,status:'待办'});
    persist(K.sched);$('#scText').value='';toast('已添加');refreshAll();
  });
  $('#scDate').value=today();
  /* 待买 */
  $('#buyAdd').addEventListener('click',function(){
    var n=$('#buyName').value.trim();if(!n){toast('请填写物品名称','err');return}
    state.buy.push({id:uid(),name:n,cat:$('#buyCat').value,qty:Math.max(1,num($('#buyQty').value)||1),price:num($('#buyPrice').value),status:'待买'});
    persist(K.buy);$('#buyName').value='';$('#buyPrice').value='';$('#buyQty').value=1;toast('已加入清单');refreshAll();
  });
  /* 书影音 */
  $$('[data-mdf]').forEach(function(b){b.addEventListener('click',function(){$$('[data-mdf]').forEach(function(x){x.classList.remove('on')});b.classList.add('on');state.ui.mdf=b.getAttribute('data-mdf');refreshAll()})});
  $$('[data-mdv]').forEach(function(b){b.addEventListener('click',function(){$$('[data-mdv]').forEach(function(x){x.classList.remove('on')});b.classList.add('on');state.ui.mdv=b.getAttribute('data-mdv');refreshAll()})});
  $('#mdAdd').addEventListener('click',function(){
    var n=$('#mdName').value.trim();if(!n){toast('请填写名称','err');return}
    state.media.push({id:uid(),name:n,type:$('#mdType').value,status:$('#mdStatus').value,stars:num($('#mdStars').value),review:$('#mdReview').value.trim(),cover:$('#mdCover').value.trim(),finish:$('#mdFinish').value||''});
    persist(K.media);$('#mdName').value='';$('#mdReview').value='';$('#mdCover').value='';$('#mdFinish').value='';toast('已收藏');refreshAll();
  });
  /* 弹窗 */
  $('#mOk').addEventListener('click',function(){$('#modalMask').classList.remove('on');if(mOkFn){var f=mOkFn;mOkFn=null;f()}});
  $('#mCancel').addEventListener('click',function(){$('#modalMask').classList.remove('on');mOkFn=null});
  /* 备份 */
  $('#btnExport').addEventListener('click',function(){
    var dump={version:1,exportedAt:new Date().toISOString(),tx:state.tx,habits:state.habits,hlogs:state.hlogs,weight:state.weight,energy:state.energy,sched:state.sched,buy:state.buy,media:state.media,meta:state.meta,plan:state.plan};
    var a=document.createElement('a');a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(dump,null,2));a.download='日常集备份_'+today()+'.json';a.click();toast('备份已导出');
  });
  $('#btnImport').addEventListener('click',function(){$('#importFile').click()});
  $('#importFile').addEventListener('change',function(e){
    var f=e.target.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        ['tx','habits','hlogs','weight','energy','sched','buy','media'].forEach(function(k){if(Array.isArray(d[k]))state[k]=d[k]});
        if(d.meta&&typeof d.meta==='object')state.meta=d.meta;
        if(Array.isArray(d.plan))state.plan=d.plan;
        ['tx','habits','hlogs','weight','energy','sched','buy','media','meta','plan'].forEach(function(k){saveKey(K[k],state[k])});
        toast('导入成功，已恢复 '+state.tx.length+' 条流水');refreshAll();
      }catch(err){toast('导入失败：文件格式不正确','err')}
    };
    rd.readAsText(f);e.target.value='';
  });
  $('#btnClearSeed').addEventListener('click',function(){
    askConfirm('清空示例数据？','只删除带「[示例]」标记的演示数据，你自己的数据不受影响。',function(){
      ['tx','habits','hlogs','weight','energy','sched','buy','media'].forEach(function(k){state[k]=state[k].filter(function(r){return !r.s})});
      if(state.meta.s){delete state.meta.height;delete state.meta.goalW;delete state.meta.budget;delete state.meta.s}
      ['tx','habits','hlogs','weight','energy','sched','buy','media','meta'].forEach(function(k){saveKey(K[k],state[k])});
      saveKey('wb_life_seeded',1);toast('示例数据已清空');refreshAll();
    });
  });
}

/* ---------- 初始化 ---------- */
function init(){
  loadAll();
  var hasData=state.tx.length||state.habits.length||state.sched.length||state.buy.length||state.media.length||state.weight.length;
  var seeded=loadKey('wb_life_seeded',0);
  if(!hasData&&!seeded){seed();saveKey('wb_life_seeded',1)}
  renderNav();
  bindAll();
  refreshAll();
}
if(document.readyState==='loading'){document.addEventListener('DOMContentLoaded',init)}else{init()}

/* PWA：仅在 https / localhost 下注册（file:// 双击打开时自动跳过，不影响使用） */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').catch(function(){/* 静默失败，不影响主功能 */});
  });
}
})();
</script>
</body>
</html>
